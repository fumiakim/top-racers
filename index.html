<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TOP RACERS — 俯瞰レース</title>
<style>
  :root{
    --bg:#11131a; --panel:#1b1f2b; --line:#2c3244;
    --fg:#e8ecf4; --muted:#98a2b8;
    --p1:#ff4d5a; --p2:#3fa9ff; --accent:#ffd23f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%,#1d2334 0%,var(--bg) 70%);
    color:var(--fg);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:12px;
    -webkit-font-smoothing:antialiased;
  }
  #wrap{position:relative;width:1000px;max-width:100%}
  canvas{
    display:block;width:100%;height:auto;
    background:#0d1017;border-radius:14px;
    box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 0 1px #2b3246 inset;
    touch-action:none;
  }

  /* ---------- overlay ---------- */
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .screen{
    pointer-events:auto;
    width:100%;height:100%;border-radius:14px;
    background:rgba(10,12,18,.86);backdrop-filter:blur(6px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(8px,1.6vw,18px);padding:clamp(12px,3vw,32px);text-align:center;
    overflow:auto;
  }
  .screen[hidden]{display:none}
  h1{
    margin:0;font-size:clamp(26px,5.4vw,54px);letter-spacing:.14em;font-weight:800;
    background:linear-gradient(180deg,#fff,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin:0;color:var(--muted);font-size:clamp(11px,1.6vw,15px);letter-spacing:.08em}
  h2{margin:0;font-size:clamp(20px,3.4vw,34px);letter-spacing:.1em}

  .row{display:flex;gap:clamp(8px,1.4vw,16px);flex-wrap:wrap;justify-content:center}
  .card{
    background:var(--panel);border:2px solid var(--line);border-radius:12px;
    padding:clamp(10px,1.6vw,18px) clamp(12px,2vw,22px);
    cursor:pointer;transition:.14s;min-width:150px;color:inherit;font:inherit;text-align:center;
  }
  .card:hover{border-color:#4a5474;transform:translateY(-2px)}
  .card.sel{border-color:var(--accent);background:#262b3a;box-shadow:0 0 0 3px rgba(255,210,63,.18)}
  .card .t{font-size:clamp(14px,2vw,19px);font-weight:700;margin-bottom:4px}
  .card .d{font-size:clamp(10px,1.4vw,12px);color:var(--muted);line-height:1.6}
  .mini{width:120px;height:84px;display:block;margin:0 auto 8px;background:#0f1219;border-radius:8px}

  button.go{
    pointer-events:auto;margin-top:6px;
    background:linear-gradient(180deg,#ffd23f,#f0a800);color:#22190a;
    border:0;border-radius:999px;padding:14px 44px;
    font-size:clamp(15px,2.2vw,20px);font-weight:800;letter-spacing:.12em;cursor:pointer;
    box-shadow:0 8px 24px rgba(255,180,0,.28);
  }
  button.go:hover{filter:brightness(1.07)}
  button.ghost{
    background:transparent;color:var(--muted);border:2px solid var(--line);
    border-radius:999px;padding:10px 26px;font-size:13px;cursor:pointer;letter-spacing:.1em;
  }
  button.ghost:hover{color:var(--fg);border-color:#4a5474}

  .keys{display:flex;gap:clamp(14px,3vw,40px);flex-wrap:wrap;justify-content:center;margin-top:4px}
  .keys div{font-size:clamp(10px,1.5vw,13px);color:var(--muted);line-height:1.9}
  .keys b{color:var(--fg);font-weight:700}
  kbd{
    display:inline-block;min-width:20px;padding:2px 6px;margin:0 1px;
    background:#252b3b;border:1px solid #39415a;border-bottom-width:2px;border-radius:5px;
    font-family:inherit;font-size:.92em;color:#dbe3f2;
  }
  .tagP1{color:var(--p1)} .tagP2{color:var(--p2)}

  table{border-collapse:collapse;font-size:clamp(11px,1.7vw,15px)}
  th,td{padding:7px clamp(8px,1.6vw,18px);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:.86em;letter-spacing:.08em}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pos{font-weight:800;color:var(--accent)}

  #hint{
    position:absolute;left:12px;bottom:10px;pointer-events:none;
    font-size:11px;color:#c6cfe2;letter-spacing:.06em;
    background:rgba(8,10,16,.55);padding:5px 10px;border-radius:7px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1000" height="700"></canvas>

  <div id="ui">
    <!-- ===== title / setup ===== -->
    <div class="screen" id="scrTitle">
      <h1>TOP&nbsp;RACERS</h1>
      <p class="sub">スクロールなし・パースなし　まるごと見える俯瞰レース</p>

      <div>
        <p class="sub" style="margin-bottom:8px">プレイ人数</p>
        <div class="row" id="players">
          <button class="card sel" data-p="1"><div class="t">1人プレイ</div><div class="d">CPU 3台と対戦</div></button>
          <button class="card" data-p="2"><div class="t">2人プレイ</div><div class="d">対戦 ＋ CPU 2台</div></button>
        </div>
      </div>

      <div>
        <p class="sub" style="margin-bottom:8px">コースを選ぶ</p>
        <div class="row" id="courses"></div>
      </div>

      <div>
        <p class="sub" style="margin-bottom:8px">周回数</p>
        <div class="row" id="laps">
          <button class="card" data-l="3" style="min-width:80px"><div class="t">3</div></button>
          <button class="card sel" data-l="5" style="min-width:80px"><div class="t">5</div></button>
          <button class="card" data-l="8" style="min-width:80px"><div class="t">8</div></button>
        </div>
      </div>

      <button class="go" id="btnStart">スタート</button>

      <div class="keys">
        <div><b class="tagP1">1P</b>　<kbd>↑</kbd><kbd>↓</kbd> アクセル/ブレーキ　<kbd>←</kbd><kbd>→</kbd> ハンドル</div>
        <div><b class="tagP2">2P</b>　<kbd>W</kbd><kbd>S</kbd> アクセル/ブレーキ　<kbd>A</kbd><kbd>D</kbd> ハンドル</div>
        <div>コース外は<b>壁</b>　ぶつかると弾かれて減速する<br><kbd>P</kbd> ポーズ　<kbd>R</kbd> やり直し　<kbd>Esc</kbd> メニュー</div>
      </div>
    </div>

    <!-- ===== pause ===== -->
    <div class="screen" id="scrPause" hidden>
      <h2>PAUSE</h2>
      <div class="row"><button class="go" id="btnResume">つづける</button></div>
      <div class="row">
        <button class="ghost" id="btnRestart2">やり直す</button>
        <button class="ghost" id="btnMenu2">メニューへ</button>
      </div>
    </div>

    <!-- ===== result ===== -->
    <div class="screen" id="scrResult" hidden>
      <h2 id="resTitle">RESULT</h2>
      <div id="resTable"></div>
      <div class="row">
        <button class="go" id="btnAgain">もう一度</button>
        <button class="ghost" id="btnMenu3">コース選択へ</button>
      </div>
    </div>
  </div>

  <div id="hint"></div>
</div>

<script>
(() => {
'use strict';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

/* =========================================================
   1. コースデータ
   中心線は「多角形の頂点 [x, y, コーナー半径]」だけで書く。
   各頂点は指定半径の円弧でフィレットされ、頂点間は直線で結ばれる。
   → カーブが必ず一定半径になり、歪んだコーナーができない。
   ========================================================= */
const COURSES = [
  {
    name:'サンシャイン・オーバル',
    diff:'かんたん',
    desc:'幅の広い高速オーバル。<br>まずはここで操作に慣れよう。',
    width:118,
    ground:{ a:'#54a548', b:'#489a3d' },
    pts:[ [700,135,135],[875,315,145],[800,565,135],[290,580,135],[125,330,145],[200,150,135] ]
  },
  {
    name:'ベイサイド・サーキット',
    diff:'ふつう',
    desc:'ロングストレートとシケイン。<br>王道のフローイングコース。',
    width:96,
    ground:{ a:'#3f9d8e', b:'#369084' },
    pts:[ [600,608,110],[880,515,100],[830,330,100],[905,170,100],[640,105,120],
          [430,255, 95],[240,110,100],[ 90,300,120],[200,430,100],[150,590, 90] ]
  },
  {
    name:'マウンテン・テクニカル',
    diff:'むずかしい',
    desc:'S字・ヘアピン・切り返し。<br>連続コーナーの上級コース。',
    width:84,
    ground:{ a:'#7b7f5e', b:'#6e7254' },
    pts:[ [820,585, 85],[915,485, 80],[740,375, 75],[895,235, 80],[790,120, 80],
          [560,140, 85],[430,270, 75],[300,120, 80],[110,230, 90],[250,390, 75],
          [105,520, 85],[210,615, 85] ]
  }
];

const SKIN = {
  road  :'#3b3e44',   // アスファルト
  apron :'#e9dcb8',   // 路肩（クリーム）
  kerbA :'#d93a2b',   // 縁石 赤
  kerbB :'#f7f7f7',   // 縁石 白
  lane  :'#e8ecf2',   // センターライン
  tire  :'#2c3a2a'    // タイヤバリア
};

/* =========================================================
   2. 中心線の生成（直線 + 一定半径の円弧）
   ========================================================= */
const STEP  = 6;    // 中心線サンプル間隔(px)
const CPN   = 12;   // チェックポイント数
const CAR_R = 13;   // 車の当たり半径

function unit(a,b){ const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1; return [dx/l,dy/l,l]; }

/** 隣り合うコーナーの円弧が重ならないよう半径を詰める */
function fitRadii(pts){
  const n=pts.length, r=pts.map(p=>p[2]), t=new Array(n), ph=new Array(n);
  for(let pass=0; pass<32; pass++){
    for(let i=0;i<n;i++){
      const A=pts[(i-1+n)%n], B=pts[i], C=pts[(i+1)%n];
      const u1=unit(B,A), u2=unit(B,C);
      let d=u1[0]*u2[0]+u1[1]*u2[1];
      ph[i]=Math.acos(Math.max(-1,Math.min(1,d)));       // 内角
      t[i]=r[i]/Math.tan(ph[i]/2);                        // 接線長
    }
    let ok=true;
    for(let i=0;i<n;i++){
      const j=(i+1)%n;
      const L=Math.hypot(pts[j][0]-pts[i][0], pts[j][1]-pts[i][1]);
      if(t[i]+t[j] > L*0.985){
        const k=L*0.985/(t[i]+t[j]);
        r[i]*=k; r[j]*=k; ok=false;
      }
    }
    if(ok) break;
  }
  return {r,t,ph};
}

/** 直線と円弧のリストを作る */
function buildSegs(pts){
  const n=pts.length, fit=fitRadii(pts);
  const P1=[],P2=[],CC=[];
  for(let i=0;i<n;i++){
    const A=pts[(i-1+n)%n], B=pts[i], C=pts[(i+1)%n];
    const u1=unit(B,A), u2=unit(B,C), t=fit.t[i];
    P1[i]=[B[0]+u1[0]*t, B[1]+u1[1]*t];   // 入口の接点
    P2[i]=[B[0]+u2[0]*t, B[1]+u2[1]*t];   // 出口の接点
    let bx=u1[0]+u2[0], by=u1[1]+u2[1];
    const bl=Math.hypot(bx,by)||1;
    const h=fit.r[i]/Math.sin(fit.ph[i]/2);
    CC[i]=[B[0]+bx/bl*h, B[1]+by/bl*h];   // 円弧の中心
  }
  const segs=[];
  for(let i=0;i<n;i++){
    const s=P2[(i-1+n)%n], e=P1[i];
    const len=Math.hypot(e[0]-s[0], e[1]-s[1]);
    if(len>0.5) segs.push({t:'L', a:s, b:e, len});

    const c=CC[i], r=fit.r[i];
    let a0=Math.atan2(P1[i][1]-c[1], P1[i][0]-c[0]);
    let a1=Math.atan2(P2[i][1]-c[1], P2[i][0]-c[0]);
    let dd=a1-a0;
    while(dd> Math.PI) dd-=Math.PI*2;
    while(dd<-Math.PI) dd+=Math.PI*2;
    segs.push({t:'A', c, r, a0, d:dd, len:Math.abs(dd)*r});
  }
  return {segs, radii:fit.r};
}

/** 等間隔サンプリング（位置・接線・法線・符号付き曲率） */
function sampleLoop(segs, step){
  const total=segs.reduce((s,g)=>s+g.len,0);
  const count=Math.max(96, Math.round(total/step));
  const ds=total/count;
  const path=new Array(count);
  let si=0, base=0;
  for(let i=0;i<count;i++){
    const s=i*ds;
    while(si<segs.length-1 && s>=base+segs[si].len){ base+=segs[si].len; si++; }
    const g=segs[si], u=s-base;
    let x,y,tx,ty,k;
    if(g.t==='L'){
      const dx=(g.b[0]-g.a[0])/g.len, dy=(g.b[1]-g.a[1])/g.len;
      x=g.a[0]+dx*u; y=g.a[1]+dy*u; tx=dx; ty=dy; k=0;
    }else{
      const sgn=Math.sign(g.d)||1;
      const ang=g.a0+sgn*(u/g.r);
      x=g.c[0]+Math.cos(ang)*g.r; y=g.c[1]+Math.sin(ang)*g.r;
      tx=-Math.sin(ang)*sgn; ty=Math.cos(ang)*sgn;
      k=sgn/g.r;                       // 符号付き曲率（+ なら法線 n 側が内側）
    }
    path[i]={x,y,tx,ty,nx:-ty,ny:tx,k};
  }
  return path;
}

function buildTrack(def){
  const {segs, radii} = buildSegs(def.pts);
  const path = sampleLoop(segs, STEP);
  return {
    ...def, path,
    n: path.length,
    half: def.width/2,
    length: segs.reduce((s,g)=>s+g.len,0),
    cpSize: path.length/CPN,
    minR: Math.min(...radii)
  };
}
const TRACKS = COURSES.map(buildTrack);

/* =========================================================
   3. コース画像を一度だけ描く
   ========================================================= */
function strokeLoop(g, path, width, color, dash, offset){
  g.beginPath();
  for(let i=0;i<=path.length;i++){
    const p=path[i%path.length];
    const x=p.x+(offset?p.nx*offset:0), y=p.y+(offset?p.ny*offset:0);
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.closePath();
  g.lineWidth=width; g.strokeStyle=color;
  g.lineJoin='round'; g.lineCap='round';
  g.setLineDash(dash||[]); g.stroke(); g.setLineDash([]);
}

function renderTrackLayer(tk){
  const cvs=document.createElement('canvas'); cvs.width=W; cvs.height=H;
  const g=cvs.getContext('2d');
  const path=tk.path, half=tk.half;

  /* --- 地面 --- */
  g.fillStyle=tk.ground.a; g.fillRect(0,0,W,H);
  g.fillStyle=tk.ground.b;
  for(let y=0;y<H;y+=26) for(let x=(y/26%2)*26;x<W;x+=52) g.fillRect(x,y,26,26);
  g.fillStyle='rgba(0,0,0,.10)';
  for(let i=0;i<260;i++){
    const x=(i*137.5)%W, y=(i*211.7)%H;
    g.beginPath(); g.arc(x,y,3+((i*53)%5),0,7); g.fill();
  }

  /* --- 路肩（クリーム）＋外周の影 --- */
  g.save(); g.globalAlpha=.25; strokeLoop(g,path,half*2+40,'#000'); g.restore();
  strokeLoop(g, path, half*2+32, SKIN.apron);

  /* --- アスファルト（別キャンバスでノイズを乗せる） --- */
  const ac=document.createElement('canvas'); ac.width=W; ac.height=H;
  const a=ac.getContext('2d');
  strokeLoop(a, path, half*2, SKIN.road);
  a.globalCompositeOperation='source-atop';
  for(let i=0;i<26000;i++){
    const x=Math.random()*W, y=Math.random()*H, v=Math.random();
    a.fillStyle = v>.5 ? 'rgba(255,255,255,.045)' : 'rgba(0,0,0,.07)';
    a.fillRect(x,y,1.6,1.6);
  }
  a.globalCompositeOperation='source-over';
  g.drawImage(ac,0,0);

  /* --- 縁石（赤白の破線）：路肩の外寄りに沿わせる --- */
  for(const s of [-1,1]){
    const off=s*(half+11);
    strokeLoop(g, path, 7, SKIN.kerbB, null, off);
    strokeLoop(g, path, 7, SKIN.kerbA, [17,17], off);
  }

  /* --- センターライン --- */
  strokeLoop(g, path, 3, SKIN.lane, [20,26]);

  /* --- タイヤバリア（コーナー外側。他の路面に被らない場所だけ） --- */
  const tires=[];
  const clear=(x,y)=>{
    for(let i=0;i<tk.n;i+=2){
      const p=path[i];
      if((p.x-x)**2+(p.y-y)**2 < (half+21)**2) return false;
    }
    return x>8 && x<W-8 && y>8 && y<H-8;
  };
  for(let i=0;i<tk.n;i+=3){
    const p=path[i];
    if(Math.abs(p.k) < 1/175) continue;              // ゆるいカーブは置かない
    const s=-Math.sign(p.k);                          // 外側
    const x=p.x+p.nx*s*(half+27), y=p.y+p.ny*s*(half+27);
    if(!clear(x,y)) continue;
    if(tires.some(t=>(t[0]-x)**2+(t[1]-y)**2 < 15*15)) continue;
    tires.push([x,y]);
  }
  for(const [x,y] of tires){
    g.fillStyle='rgba(0,0,0,.28)'; g.beginPath(); g.arc(x+1.5,y+2,8,0,7); g.fill();
    g.fillStyle=SKIN.tire;         g.beginPath(); g.arc(x,y,8,0,7); g.fill();
    g.fillStyle='rgba(255,255,255,.13)'; g.beginPath(); g.arc(x,y,3.4,0,7); g.fill();
  }

  /* --- スタート／フィニッシュ --- */
  const s0=path[0], cell=(half*2)/8;
  g.save();
  g.translate(s0.x,s0.y); g.rotate(Math.atan2(s0.ty,s0.tx));
  for(let r=0;r<3;r++) for(let q=0;q<8;q++){
    g.fillStyle=((r+q)%2)?'#15161a':'#f4f6fa';
    g.fillRect(-12+r*8, -half+q*cell, 8, cell);
  }
  g.restore();

  return cvs;
}
const LAYERS = TRACKS.map(renderTrackLayer);

/* =========================================================
   4. 車
   ========================================================= */
const CAR_COLORS = [
  {body:'#ff4d5a', dark:'#b4232f', name:'1P'},
  {body:'#3fa9ff', dark:'#1a6fb5', name:'2P'},
  {body:'#3fd07a', dark:'#1f8a4c', name:'CPU'},
  {body:'#ffd23f', dark:'#c79a00', name:'CPU'}
];

const PHYS = {
  accel:0.118, brake:0.20, revAccel:0.055,
  maxSpeed:5.05, drag:0.986, grip:0.145,
  turn:0.052,
  wallBounce:0.30,     // 壁の反発
  wallScrape:0.055     // 壁ずりの減速（当たりの強さに比例）
};

class Car{
  constructor(idx, isCPU, skill){
    this.idx=idx; this.col=CAR_COLORS[idx];
    this.isCPU=isCPU; this.skill=skill;
    this.lane=[0.05,-0.22,0.20,-0.12][idx%4];
    this.reset();
  }
  reset(){
    this.x=0;this.y=0;this.a=0;this.vx=0;this.vy=0;
    this.lap=0; this.cp=0; this.cpSeen=0; this.node=0; this.off=0;
    this.finished=false; this.finishTime=0; this.rank=0;
    this.lapTimes=[]; this.best=Infinity; this.lapStart=0;
    this.hit=0; this.fx=null; this.trail=[];
  }
  get speed(){ return Math.hypot(this.vx,this.vy); }
}

/* =========================================================
   5. ゲーム状態
   ========================================================= */
const G = {
  mode:'title', players:1, courseIdx:0, totalLaps:5,
  track:null, layer:null,
  cars:[], countdown:0, raceTime:0,
  finishOrder:[], last:0, acc:0, shake:0
};

const keys = Object.create(null);
addEventListener('keydown', e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if(!keys[k]) onKeyPress(k);
  keys[k]=true;
});
addEventListener('keyup', e=>{ keys[e.key.length===1?e.key.toLowerCase():e.key]=false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

function onKeyPress(k){
  if(k==='p'){ if(G.mode==='race') pause(); else if(G.mode==='pause') resume(); }
  if(k==='r'){ if(G.mode!=='title') startRace(); }
  if(k==='Escape'){ if(G.mode!=='title') toTitle(); }
}

let actx=null;
function beep(freq, dur=0.12, type='square', vol=0.16){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(_){}
}

/* =========================================================
   6. レース開始
   ========================================================= */
function startRace(){
  const tk = TRACKS[G.courseIdx];
  G.track=tk; G.layer=LAYERS[G.courseIdx];

  const CAR_COUNT=4, rows=CAR_COUNT/2;
  G.cars=[];
  for(let i=0;i<CAR_COUNT;i++){
    const isCPU = i>=G.players;
    const skill = isCPU ? ([0.98,0.95,0.92][i-G.players] ?? 0.90) : 1;
    G.cars.push(new Car(i, isCPU, skill));
  }
  // グリッド：2列×2行。前列がプレイヤー。全車ともスタートライン直後（CP0内）
  G.cars.forEach((car,i)=>{
    const row=Math.floor(i/2), side=(i%2)?1:-1;
    const node=(10+(rows-1-row)*13)%tk.n;
    const p=tk.path[node];
    const off=side*Math.min(tk.half-CAR_R-2, tk.half*0.42);
    car.reset();
    car.x=p.x+p.nx*off; car.y=p.y+p.ny*off;
    car.a=Math.atan2(p.ty,p.tx);
    car.node=node;
  });

  G.finishOrder=[]; G.raceTime=0; G.countdown=3.6; G.shake=0; G.mode='count';
  showScreen(null);
  beep(660,0.14);
}

/* =========================================================
   7. コース上の位置（最寄りノードを局所探索）
   ========================================================= */
function nearestNode(tk, car){
  const n=tk.n;
  let best=1e18, bi=car.node;
  for(let d=-16; d<=30; d++){
    const i=((car.node+d)%n+n)%n, p=tk.path[i];
    const dd=(p.x-car.x)**2+(p.y-car.y)**2;
    if(dd<best){ best=dd; bi=i; }
  }
  if(best > (tk.half+120)**2){                 // 念のための全探索リカバリ
    for(let i=0;i<n;i++){
      const p=tk.path[i], dd=(p.x-car.x)**2+(p.y-car.y)**2;
      if(dd<best){ best=dd; bi=i; }
    }
  }
  return bi;
}

/* =========================================================
   8. 更新
   ========================================================= */
const DT = 1/60;

function update(){
  const tk=G.track;
  if(G.shake>0) G.shake-=DT*4;

  if(G.mode==='count'){
    const prev=Math.ceil(G.countdown);
    G.countdown-=DT;
    const now=Math.ceil(G.countdown);
    if(now!==prev && now>=0) beep(now===0?880:440, now===0?0.35:0.12);
    if(G.countdown<=0){ G.countdown=0; G.mode='race'; }
    return;
  }
  if(G.mode!=='race') return;

  G.raceTime+=DT;

  for(const car of G.cars){ if(!car.finished) drive(car,tk); integrate(car); }
  carCollisions();
  for(const car of G.cars){
    car.node=nearestNode(tk,car);
    wallCollision(car,tk);
    if(car.hit>0) car.hit--;
    if(car.fx){ car.fx.life--; if(car.fx.life<=0) car.fx=null; }
  }
  for(const car of G.cars) progress(car,tk);

  if(G.cars.slice(0,G.players).every(c=>c.finished)) finishRace();
}

/* ---------- 入力 / AI ---------- */
function drive(car, tk){
  if(car.isCPU){ aiControl(car,tk); return; }
  if(car.idx===0){
    car.throttle=(keys['ArrowUp']?1:0)-(keys['ArrowDown']?1:0);
    car.steer   =(keys['ArrowRight']?1:0)-(keys['ArrowLeft']?1:0);
  }else{
    car.throttle=(keys['w']?1:0)-(keys['s']?1:0);
    car.steer   =(keys['d']?1:0)-(keys['a']?1:0);
  }
}

function norm(x){ while(x>Math.PI)x-=Math.PI*2; while(x<-Math.PI)x+=Math.PI*2; return x; }

function aiControl(car, tk){
  const n=tk.n, spd=car.speed;
  const look=Math.round(7+spd*3.6);
  const tgt=tk.path[(car.node+look)%n];

  // 先の最小旋回半径から上限速度を出す（半径が厳密に分かるので精度が高い）
  let kMax=0;
  for(let d=3; d<look+20; d++){
    const k=Math.abs(tk.path[(car.node+d)%n].k);
    if(k>kMax) kMax=k;
  }
  const R = kMax>1e-6 ? 1/kMax : 1e6;
  const target = Math.min(PHYS.maxSpeed, PHYS.turn*R*0.90)*car.skill;

  // ライン取り：コーナー内側 ＋ 車ごとのレーンの癖
  const bend=Math.min(1, Math.abs(tgt.k)*230);
  const inner=Math.sign(tgt.k)*tk.half*0.46*bend;
  let offset=inner + car.lane*tk.half*(1-bend);
  // 壁が近ければ内側へ寄せる
  const lim=tk.half-CAR_R;
  if(Math.abs(car.off) > lim*0.8) offset = -Math.sign(car.off)*tk.half*0.25;
  offset=Math.max(-lim*0.85, Math.min(lim*0.85, offset));

  const tx=tgt.x+tgt.nx*offset, ty=tgt.y+tgt.ny*offset;
  const diff=norm(Math.atan2(ty-car.y, tx-car.x)-car.a);
  car.steer=Math.max(-1,Math.min(1,diff*2.8));
  car.throttle = spd>target+0.2 ? -0.8 : (spd<target ? 1 : 0);
  if(Math.abs(diff)>1.0) car.throttle=-0.5;
}

/* ---------- 物理 ---------- */
function integrate(car){
  const th=car.finished?-0.35:(car.throttle||0);
  const st=car.finished?0:(car.steer||0);

  const fx=Math.cos(car.a), fy=Math.sin(car.a);
  const fwd=car.vx*fx+car.vy*fy;

  if(th>0)      { const a=(fwd<0?PHYS.brake:PHYS.accel)*th; car.vx+=fx*a; car.vy+=fy*a; }
  else if(th<0) { const a=(fwd>0.05?PHYS.brake:PHYS.revAccel)*(-th); car.vx-=fx*a; car.vy-=fy*a; }

  // 舵の効き。壁に押しつけて止まっても、アクセルを踏んでいれば向きは変えられる
  // （これが無いと壁に鼻から刺さったまま脱出できなくなる）
  const eff=Math.min(1, Math.max(Math.abs(fwd)/1.25, Math.abs(th)*0.5));
  car.a += st*PHYS.turn*eff*(fwd<-0.05?-1:1);

  // 横滑りをグリップ分だけ吸収（残りがドリフト感）
  const lat=car.vx*(-fy)+car.vy*fx;
  car.vx-=(-fy)*lat*(PHYS.grip*6.2);
  car.vy-=( fx)*lat*(PHYS.grip*6.2);

  car.vx*=PHYS.drag; car.vy*=PHYS.drag;

  const sp=Math.hypot(car.vx,car.vy);
  if(sp>PHYS.maxSpeed){ car.vx*=PHYS.maxSpeed/sp; car.vy*=PHYS.maxSpeed/sp; }

  car.x+=car.vx; car.y+=car.vy;

  if(sp>1.2 && Math.abs(lat)>0.55){
    car.trail.push({x:car.x,y:car.y,a:car.a,life:1});
    if(car.trail.length>90) car.trail.shift();
  }
  for(const t of car.trail) t.life-=0.012;
  while(car.trail.length && car.trail[0].life<=0) car.trail.shift();
}

/* ---------- 壁（コース外）との衝突 ---------- */
function wallCollision(car, tk){
  const p=tk.path[car.node];
  const off=(car.x-p.x)*p.nx + (car.y-p.y)*p.ny;   // 中心線からの横位置
  car.off=off;
  const lim=tk.half-CAR_R;
  if(Math.abs(off)<=lim) return;

  const s=Math.sign(off);
  // 壁の内側へ押し戻す
  const push=off-s*lim;
  car.x-=p.nx*push; car.y-=p.ny*push;
  car.off=s*lim;

  // 法線方向の速度を反発させ、接線方向も擦れて減速
  const vn=car.vx*p.nx+car.vy*p.ny;
  if(vn*s>0){
    const imp=vn*(1+PHYS.wallBounce);
    car.vx-=p.nx*imp; car.vy-=p.ny*imp;
    const hard=Math.abs(vn);
    if(hard>0.9){
      car.hit=8;
      car.fx={x:p.x+p.nx*s*tk.half, y:p.y+p.ny*s*tk.half, life:10};
      if(!car.isCPU){
        beep(110+Math.random()*40, 0.07, 'sawtooth', Math.min(.18, hard*0.05));
        G.shake=Math.min(1, hard*0.22);
      }
    }
  }
  // 壁ずりの減速は当たりの強さに比例（軽く触れただけならほとんど減速しない）
  const f=1-Math.min(0.14, Math.abs(vn)*PHYS.wallScrape);
  car.vx*=f; car.vy*=f;
}

/* ---------- 車同士 ---------- */
function carCollisions(){
  const R=CAR_R+2;
  for(let i=0;i<G.cars.length;i++) for(let j=i+1;j<G.cars.length;j++){
    const a=G.cars[i], b=G.cars[j];
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
    if(d>0 && d<R*2){
      const ux=dx/d, uy=dy/d, push=(R*2-d)/2;
      a.x-=ux*push; a.y-=uy*push; b.x+=ux*push; b.y+=uy*push;
      const rel=(b.vx-a.vx)*ux+(b.vy-a.vy)*uy;
      if(rel<0){
        const imp=rel*0.72;
        a.vx+=ux*imp; a.vy+=uy*imp; b.vx-=ux*imp; b.vy-=uy*imp;
      }
    }
  }
}

/* ---------- 周回判定 ---------- */
function progress(car, tk){
  if(car.finished) return;
  const cp=Math.floor(car.node/tk.cpSize)%CPN;
  const next=(car.cp+1)%CPN;
  if(cp===next){
    car.cp=cp; car.cpSeen++;
    // CP を一周ぶん順番に通過して初めてラップ成立
    if(cp===0 && car.cpSeen>=CPN){
      car.cpSeen=0;
      const t=G.raceTime, lapT=t-car.lapStart;
      car.lapTimes.push(lapT);
      if(lapT<car.best) car.best=lapT;
      car.lapStart=t; car.lap++;
      if(!car.isCPU) beep(car.lap>=G.totalLaps?1046:784, 0.16, 'triangle', .12);
      if(car.lap>=G.totalLaps){
        car.finished=true; car.finishTime=t;
        G.finishOrder.push(car); car.rank=G.finishOrder.length;
      }
    }
  }else if(cp===(car.cp-1+CPN)%CPN){
    car.cp=cp; car.cpSeen=Math.max(0,car.cpSeen-1);
  }
}

function finishRace(){
  const rest=G.cars.filter(c=>!c.finished).sort((a,b)=>total(b)-total(a));
  for(const c of rest){ G.finishOrder.push(c); c.rank=G.finishOrder.length; }
  G.mode='result'; showResult();
  beep(880,0.18,'triangle'); setTimeout(()=>beep(1174,0.28,'triangle'),170);
}
function total(c){ return c.lap*100000 + c.cpSeen*1000 + c.node; }

function rankings(){
  return [...G.cars].sort((a,b)=>{
    if(a.finished&&b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return total(b)-total(a);
  });
}

/* =========================================================
   9. 描画
   ========================================================= */
function draw(){
  if(!G.track){ drawIdle(); return; }

  ctx.save();
  if(G.shake>0){
    ctx.translate((Math.random()-.5)*G.shake*7, (Math.random()-.5)*G.shake*7);
  }
  ctx.drawImage(G.layer,0,0);

  // タイヤ痕
  for(const car of G.cars){
    for(const t of car.trail){
      ctx.globalAlpha=t.life*0.30;
      ctx.fillStyle='#101216';
      const dx=Math.cos(t.a+Math.PI/2)*5, dy=Math.sin(t.a+Math.PI/2)*5;
      ctx.fillRect(t.x+dx-1.5,t.y+dy-1.5,3,3);
      ctx.fillRect(t.x-dx-1.5,t.y-dy-1.5,3,3);
    }
  }
  ctx.globalAlpha=1;

  for(const car of G.cars) drawCar(car);
  for(const car of G.cars) if(car.fx) drawSpark(car.fx);
  ctx.restore();

  drawHUD();
  if(G.mode==='count') drawCountdown();
}

function drawSpark(fx){
  const a=fx.life/10;
  ctx.save(); ctx.globalAlpha=a;
  for(let i=0;i<5;i++){
    const ang=i*1.257+fx.life, r=3+(10-fx.life)*1.7;
    ctx.fillStyle=i%2?'#ffd23f':'#fff6d0';
    ctx.beginPath(); ctx.arc(fx.x+Math.cos(ang)*r, fx.y+Math.sin(ang)*r, 2.2*a+0.6, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawCar(c){
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.a);

  ctx.fillStyle='rgba(0,0,0,.34)';
  roundRect(-12,-8,26,16,4); ctx.fill();

  ctx.fillStyle='#15171d';
  ctx.fillRect(-11,-10,7,4); ctx.fillRect(-11,6,7,4);
  ctx.fillRect(5,-10,7,4);   ctx.fillRect(5,6,7,4);

  ctx.fillStyle=c.hit>0 ? '#fff' : c.col.body;
  roundRect(-14,-8.5,28,17,5); ctx.fill();
  ctx.fillStyle=c.col.dark;
  roundRect(-14,-8.5,7,17,4); ctx.fill();

  ctx.fillStyle='rgba(16,20,30,.85)';
  roundRect(-3,-5.5,9,11,3); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.22)';
  roundRect(-12,-8,24,4,3); ctx.fill();
  ctx.fillStyle=c.col.dark;
  ctx.fillRect(-16,-7,3,14);
  ctx.restore();

  if(!c.isCPU){
    ctx.save();
    ctx.font='700 11px system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,.6)';
    roundRect(c.x-13, c.y-30, 26, 15, 4); ctx.fill();
    ctx.fillStyle=c.col.body;
    ctx.fillText(c.col.name, c.x, c.y-22.5);
    ctx.restore();
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function fmt(t){
  if(!isFinite(t)) return '--:--.--';
  const m=Math.floor(t/60), s=t-m*60;
  return `${m}:${s.toFixed(2).padStart(5,'0')}`;
}

function drawHUD(){
  ctx.save();
  ctx.textBaseline='top';
  const list=rankings();

  G.cars.slice(0,G.players).forEach((c,i)=>{
    const y=12+i*54;
    ctx.fillStyle='rgba(8,10,16,.66)';
    roundRect(12,y,206,46,9); ctx.fill();
    ctx.fillStyle=c.col.body; roundRect(12,y,5,46,3); ctx.fill();

    const pos=list.indexOf(c)+1;
    ctx.textAlign='left';
    ctx.fillStyle=c.col.body;
    ctx.font='800 14px system-ui,sans-serif';
    ctx.fillText(c.col.name, 26, y+7);
    ctx.fillStyle='#e8ecf4';
    ctx.font='800 17px system-ui,sans-serif';
    ctx.fillText(`${pos}位`, 62, y+5);
    ctx.font='700 13px system-ui,sans-serif';
    ctx.fillStyle='#98a2b8';
    ctx.fillText(`LAP ${Math.min(c.lap+1,G.totalLaps)}/${G.totalLaps}`, 110, y+7);
    ctx.fillStyle='#7f8aa3';
    ctx.font='600 11px system-ui,sans-serif';
    ctx.fillText(`BEST ${fmt(c.best)}`, 26, y+27);
    if(c.hit>0 && !c.finished){
      ctx.fillStyle='#ff6b5a';
      ctx.fillText('ウォール接触！', 132, y+27);
    }
  });

  ctx.textAlign='right';
  ctx.fillStyle='rgba(8,10,16,.66)';
  roundRect(W-176,12,164,30+list.length*20,9); ctx.fill();
  ctx.fillStyle='#e8ecf4';
  ctx.font='800 18px system-ui,sans-serif';
  ctx.fillText(fmt(G.raceTime), W-22, 17);
  ctx.font='600 12px system-ui,sans-serif';
  list.forEach((c,i)=>{
    const y=44+i*20;
    ctx.textAlign='left';
    ctx.fillStyle=c.col.body; ctx.fillRect(W-166,y+3,8,8);
    ctx.fillStyle=c.finished?'#ffd23f':(c.isCPU?'#98a2b8':'#e8ecf4');
    ctx.fillText(`${i+1}. ${c.isCPU?'CPU '+(c.idx+1):c.col.name}`, W-152, y);
    ctx.textAlign='right';
    ctx.fillText(c.finished?'FIN':`L${Math.min(c.lap+1,G.totalLaps)}`, W-22, y);
  });
  ctx.restore();
}

function drawCountdown(){
  const n=Math.ceil(G.countdown), frac=G.countdown-Math.floor(G.countdown);
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const txt=n>0?String(Math.min(n,3)):'GO!';
  ctx.translate(W/2,H/2);
  ctx.scale(1+(1-frac)*0.35, 1+(1-frac)*0.35);
  ctx.font='900 110px system-ui,sans-serif';
  ctx.lineWidth=10; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.strokeText(txt,0,0);
  ctx.fillStyle=n>0?'#fff':'#54ff92'; ctx.fillText(txt,0,0);
  ctx.restore();
}

function drawIdle(){
  ctx.drawImage(LAYERS[G.courseIdx],0,0);
  ctx.fillStyle='rgba(10,12,18,.35)';
  ctx.fillRect(0,0,W,H);
}

/* =========================================================
   10. ループ
   ========================================================= */
function loop(ts){
  requestAnimationFrame(loop);
  if(!G.last) G.last=ts;
  let dt=(ts-G.last)/1000; G.last=ts;
  if(dt>0.25) dt=0.25;
  G.acc+=dt;
  while(G.acc>=DT){ update(); G.acc-=DT; }
  draw();
}
requestAnimationFrame(loop);

/* =========================================================
   11. UI
   ========================================================= */
const scr={
  title:document.getElementById('scrTitle'),
  pause:document.getElementById('scrPause'),
  result:document.getElementById('scrResult')
};
function showScreen(name){ for(const k in scr) scr[k].hidden=(k!==name); }

const coursesEl=document.getElementById('courses');
COURSES.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='card'+(i===0?' sel':''); b.dataset.c=i;
  b.innerHTML=`<canvas class="mini" width="120" height="84"></canvas>
    <div class="t">${c.name}</div>
    <div class="d">${c.diff}<br>${c.desc}</div>`;
  coursesEl.appendChild(b);
  const m=b.querySelector('.mini').getContext('2d');
  const tk=TRACKS[i], s=Math.min(120/W, 84/H);
  m.fillStyle=c.ground.a; m.fillRect(0,0,120,84);
  m.save(); m.translate((120-W*s)/2,(84-H*s)/2); m.scale(s,s);
  m.lineJoin='round'; m.lineCap='round';
  m.beginPath();
  for(let k=0;k<=tk.n;k+=2){ const p=tk.path[k%tk.n]; k?m.lineTo(p.x,p.y):m.moveTo(p.x,p.y); }
  m.closePath();
  m.lineWidth=c.width+22; m.strokeStyle=SKIN.apron; m.stroke();
  m.lineWidth=c.width;    m.strokeStyle=SKIN.road;  m.stroke();
  m.restore();
});

function pickGroup(id, attr, cb){
  const el=document.getElementById(id);
  el.addEventListener('click', e=>{
    const b=e.target.closest('.card'); if(!b) return;
    [...el.querySelectorAll('.card')].forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); cb(b.dataset[attr]);
  });
}
pickGroup('players','p', v=>G.players=+v);
pickGroup('courses','c', v=>G.courseIdx=+v);
pickGroup('laps','l',    v=>G.totalLaps=+v);

document.getElementById('btnStart').onclick   = ()=>startRace();
document.getElementById('btnResume').onclick  = resume;
document.getElementById('btnRestart2').onclick= ()=>startRace();
document.getElementById('btnMenu2').onclick   = toTitle;
document.getElementById('btnAgain').onclick   = ()=>startRace();
document.getElementById('btnMenu3').onclick   = toTitle;

function pause(){ G.mode='pause'; showScreen('pause'); }
function resume(){ G.mode='race'; showScreen(null); }
function toTitle(){ G.mode='title'; G.track=null; showScreen('title'); }

function showResult(){
  const list=[...G.finishOrder], top=list[0];
  document.getElementById('resTitle').textContent =
    !top ? 'RESULT'
    : top.isCPU ? `RESULT　— CPU ${top.idx+1} の勝ち`
    : (G.players>=2 ? `🏆 ${top.col.name} の勝ち！` : '🏆 WINNER!');

  let html='<table><tr><th>順位</th><th>ドライバー</th><th>タイム</th><th>ベストラップ</th></tr>';
  list.forEach((c,i)=>{
    const nm=c.isCPU?`CPU ${c.idx+1}`:`${c.col.name}（プレイヤー）`;
    html+=`<tr><td class="pos">${i+1}</td>
      <td style="color:${c.col.body};font-weight:700">${nm}</td>
      <td class="num">${c.finished?fmt(c.finishTime):'未完走'}</td>
      <td class="num">${fmt(c.best)}</td></tr>`;
  });
  document.getElementById('resTable').innerHTML=html+'</table>';
  showScreen('result');
}

document.getElementById('hint').textContent='コース外は壁　P:ポーズ / R:やり直し / Esc:メニュー';
showScreen('title');
})();
